services:
  trace-store:
    build:
      context: .
    command: ["traceforge-store"]
    environment:
      TRACEFORGE_STORE_DB: /var/lib/traceforge/traceforge.db
      TRACEFORGE_STORE_OTLP_ADDRESS: 0.0.0.0:4320
      TRACEFORGE_STORE_HTTP_ADDRESS: 0.0.0.0:8081
    volumes:
      - traceforge-data:/var/lib/traceforge
    expose:
      - "4320"
    ports:
      - "8081:8081"

  central-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel/central-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - trace-store
    expose:
      - "4319"

  privacy-gateway:
    build:
      context: .
    command: ["traceforge-gateway"]
    environment:
      TRACEFORGE_UPSTREAM_OTLP_ENDPOINT: central-collector:4319
      TRACEFORGE_UPSTREAM_INSECURE: "true"
      TRACEFORGE_REDACTION_MODE: redact
      TRACEFORGE_REDACT_PII: "true"
      TRACEFORGE_DETECT_HIGH_ENTROPY: "true"
      TRACEFORGE_MAX_INFLIGHT_EXPORTS: "64"
      TRACEFORGE_ADMISSION_TIMEOUT_SECONDS: "0.25"
    depends_on:
      - central-collector
    ports:
      - "4317:4317"
      - "8080:8080"

volumes:
  traceforge-data:
