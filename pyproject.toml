[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "karzoun-traceforge"
version = "0.1.0"
description = "Privacy-first observability and trace collection platform for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mahmoud Karzoun"}]
dependencies = [
  "grpcio>=1.66,<2",
  "opentelemetry-proto>=1.27,<2",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
  "mypy>=1.15",
]
azure = [
  "azure-kusto-data>=6.0.4,<7",
]

[project.scripts]
traceforge-scrub = "traceforge.cli:main"
traceforge-gateway = "traceforge.gateway.server:main"
traceforge-store = "traceforge.store.server:main"
traceforge-demo = "traceforge.demo:main"
traceforge-export = "traceforge.store.export_cli:main"
traceforge-kusto-viewer = "traceforge.kusto.viewer_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traceforge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
packages = ["traceforge"]
