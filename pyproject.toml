[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "karzoun-traceforge"
version = "0.1.0"
description = "Privacy-first observability and trace collection platform for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mahmoud Karzoun"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
  "mypy>=1.15",
]

[project.scripts]
traceforge-scrub = "traceforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traceforge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["traceforge"]
