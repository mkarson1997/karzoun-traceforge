name: package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Build release handoff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Resolve package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = data["project"]["version"]
          tag = os.environ.get("GITHUB_REF_NAME", "")
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          if ref_type == "tag" and tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match pyproject version v{version}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"TRACEFORGE_PACKAGE_VERSION={version}\n")
          PY

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pip-tools pip-audit
          python -m build
          python -m twine check dist/*

      - name: Generate release dependency evidence
        run: |
          pip-compile --all-extras --strip-extras --output-file dist/requirements-audit.txt pyproject.toml
          pip-audit --strict --progress-spinner off -r dist/requirements-audit.txt
          pip-audit --progress-spinner off -r dist/requirements-audit.txt --format cyclonedx-json --output dist/sbom.cdx.json

      - name: Build all container images
        run: |
          docker build -t traceforge:${TRACEFORGE_PACKAGE_VERSION} .
          docker build -f Dockerfile.collector -t traceforge-collector:${TRACEFORGE_PACKAGE_VERSION} .
          docker build -f Dockerfile.viewer -t traceforge-viewer:${TRACEFORGE_PACKAGE_VERSION} .
          docker build -f Dockerfile.control-plane -t traceforge-control-plane:${TRACEFORGE_PACKAGE_VERSION} .

      - name: Validate product compose profile
        env:
          TRACEFORGE_TENANT_SIGNING_KEY: package-validation-signing-key-000000000000
        run: |
          docker compose -f deploy/compose/product.yml config --quiet

      - name: Assemble commercial handoff bundle
        run: |
          mkdir -p handoff/docs handoff/deploy/compose
          cp LICENSE SECURITY.md SUPPORT.md CHANGELOG.md README.md handoff/
          cp docs/architecture.md docs/threat-model.md docs/data-model.md docs/adapters.md docs/policies.md docs/multi-tenancy.md docs/retention.md docs/deployment-guide.md docs/commercial-packaging.md docs/azure-deployment.md handoff/docs/
          cp deploy/compose/product.yml deploy/compose/product.env.example handoff/deploy/compose/
          cp dist/* handoff/
          git rev-parse HEAD > handoff/COMMIT_SHA
          printf '%s\n' "${TRACEFORGE_PACKAGE_VERSION}" > handoff/VERSION
          tar -czf "traceforge-handoff-${TRACEFORGE_PACKAGE_VERSION}.tar.gz" handoff

      - name: Generate checksums
        run: |
          sha256sum dist/* "traceforge-handoff-${TRACEFORGE_PACKAGE_VERSION}.tar.gz" > SHA256SUMS.txt

      - name: Upload release handoff
        uses: actions/upload-artifact@v4
        with:
          name: traceforge-handoff-${{ env.TRACEFORGE_PACKAGE_VERSION }}
          path: |
            dist/
            SHA256SUMS.txt
            traceforge-handoff-${{ env.TRACEFORGE_PACKAGE_VERSION }}.tar.gz
          if-no-files-found: error
          retention-days: 30
