name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Bicep CLI
        run: az bicep install
      - name: Compile Azure production template
        run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      - name: Build pinned collector image
        run: docker build -f Dockerfile.collector -t traceforge-collector:ci .
      - name: Build ADX viewer image
        run: docker build -f Dockerfile.viewer -t traceforge-viewer:ci .
      - name: Build control plane image
        run: docker build -f Dockerfile.control-plane -t traceforge-control-plane:ci .
      - name: Validate product compose profile
        env:
          TRACEFORGE_TENANT_SIGNING_KEY: package-validation-signing-key-000000000000
        run: docker compose -f deploy/compose/product.yml config --quiet


  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build Python release artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify package workflow is present
        run: test -s .github/workflows/package.yml
