name: benchmarks

on:
  workflow_dispatch:
    inputs:
      soak_duration_seconds:
        description: Duration of the local gateway soak phase
        required: false
        default: "30"
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read

jobs:
  reliability:
    name: Privacy, load, soak, and failure tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOAK_DURATION_SECONDS: ${{ inputs.soak_duration_seconds || '30' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install TraceForge test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Privacy microbenchmark with leak assertions
        run: traceforge-benchmark privacy --iterations 2000 --output privacy-benchmark.json
      - name: Deterministic failure injection tests
        run: pytest -q tests/test_failure_injection.py tests/test_benchmark.py
      - name: Start complete local OTLP pipeline
        run: docker compose up --build -d
      - name: Wait for privacy gateway readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Gateway concurrent load test
        run: >-
          traceforge-benchmark gateway
          --endpoint 127.0.0.1:4317
          --insecure
          --requests 1000
          --concurrency 16
          --output gateway-load.json
      - name: Gateway soak test
        run: >-
          traceforge-benchmark gateway
          --endpoint 127.0.0.1:4317
          --insecure
          --duration-seconds "$SOAK_DURATION_SECONDS"
          --concurrency 16
          --output gateway-soak.json
      - name: Capture final gateway metrics
        if: always()
        run: curl --silent http://127.0.0.1:8080/metrics > gateway-metrics.prom || true
      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color > benchmark-services.log || true
      - name: Stop local pipeline
        if: always()
        run: docker compose down -v || true
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: traceforge-benchmark-evidence
          path: |
            privacy-benchmark.json
            gateway-load.json
            gateway-soak.json
            gateway-metrics.prom
            benchmark-services.log
          if-no-files-found: warn
          retention-days: 30
